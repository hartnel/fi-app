{% load crispy_forms_tags %}
<html>
<head>
    <title>Enregistrement de Fi</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Formulaire d'enregistrement des FI</h1>
        
        <form action="#" method="POST">
            <!-- Champ 1 : Nom de la FI/FJI -->
            <div class="mb-3">
                <label for="nomFI" class="form-label">Entrez le nom de votre FI/FJI :</label>
                <input type="text" class="form-control" id="nomFI" name="nomFI" required>
            </div>
            
            <!-- Champ 2 : Type de la FI -->
            <div class="mb-3">
                <label for="typeFI" class="form-label">Entrez le type de votre FI :</label>
                <select class="form-select" id="typeFI" name="typeFI" required>
                    <option value="FI">FI</option>
                    <option value="FIJ">FIJ</option>
                </select>
            </div>
            
            <div class="text-center">
                <button type="submit" class="btn btn-primary">Enregistrer</button>
            </div>
        </form>
    </div>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
